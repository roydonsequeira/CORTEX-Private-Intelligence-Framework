name: Release

# Pushing a version tag such as v2.0.0a1 builds the UI and the Python package,
# checks the files, and publishes them to PyPI once you approve the `pypi`
# environment. Run it by hand (Actions > Release > Run workflow) for a dry run:
# it builds and checks the files and publishes nothing. RELEASING.md has the
# steps and the one-time setup on PyPI and GitHub.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Each job lists the permissions it needs; there are no others.
permissions: {}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency caches: a release installs from the lockfiles alone, so a
      # cache saved by another run can't change what gets published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Build the UI into the package
        working-directory: ui
        run: |
          npm ci
          npm run build:bundle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the build tools, pinned with hashes
        run: python -m pip install --require-hashes -r .github/release/requirements.txt
      - name: Build the sdist, then the wheel from it
        run: python -m build --no-isolation
      - name: Check the files
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python scripts/check_dist.py dist --tag "$TAG"
          else
            python scripts/check_dist.py dist
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Only a pushed tag publishes. A run started by hand stops after the checks.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for quietpost accepts this workflow only in this
    # environment, and the environment waits for your approval.
    environment:
      name: pypi
      url: https://pypi.org/project/quietpost/
    permissions:
      id-token: write # trusted publishing and the attestations; nothing else
    steps:
      # The files the build job checked. This job runs none of the project's code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Checks the metadata, signs each file with a Sigstore attestation (PEP 740)
      # and uploads both, logging each file's SHA-256.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Minor and patch updates arrive together; each major version gets its own
    # PR, so one breaking upgrade can't block the rest.
    groups:
      ui-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next's plugins (react, jsx-a11y, import) support ESLint 9 only.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet (it needs < 6.1).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types follow the Node.js major the UI runs on (24, see ui/Dockerfile).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/ui"
    schedule:
      interval: "weekly"

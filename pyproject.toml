[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-agent"
version = "1.0.0"
description = "CORTEX — Private Intelligence Framework. A fully local, privacy-first AI agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Roydon Sequeira" }]
requires-python = ">=3.12"
keywords = ["ai-agent", "local-llm", "ollama", "rag", "react-agent", "privacy", "fastapi", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115,<0.200",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "chromadb>=0.5,<2.0",
    "aiosqlite>=0.20,<1.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp>=1.25,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
    "structlog>=24.4,<26.0",
    "anyio>=4.6,<5.0",
    "pyyaml>=6.0,<7.0",
    "restrictedpython>=8.0,<9.0",
    "html2text>=2024.2.26",
    "jsonschema>=4.23,<5.0",
    "truststore>=0.9",
]

[project.urls]
Homepage = "https://github.com/roydonsequeira/CORTEX-Private-Intelligence-Framework"
Repository = "https://github.com/roydonsequeira/CORTEX-Private-Intelligence-Framework"
Issues = "https://github.com/roydonsequeira/CORTEX-Private-Intelligence-Framework/issues"
Changelog = "https://github.com/roydonsequeira/CORTEX-Private-Intelligence-Framework/blob/main/CHANGELOG.md"

[project.scripts]
cortex = "cortex.cli:main"

[project.optional-dependencies]
container = [
    "docker>=7.0,<8.0",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2.0",
    "httpx[testing]>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pytest-cov>=5.0,<8.0",
    "types-pyyaml",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live-model tests are opt-in: run them with `pytest -m ollama` against a
# running Ollama. They are deselected from the default suite and CI.
addopts = "-m 'not ollama'"
markers = [
    "ollama: integration tests that require a running Ollama server (deselected by default)",
]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["RestrictedPython", "RestrictedPython.*", "docker", "docker.*"]
ignore_missing_imports = true
# RestrictedPython 8.5+ ships inline types but does not list re-exports in
# __all__; treat its imported names as re-exported so strict mode accepts them.
implicit_reexport = true

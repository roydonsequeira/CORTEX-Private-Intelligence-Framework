[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-agent"
version = "0.1.0"
description = "CORTEX — Private Intelligence Framework. A fully local, privacy-first AI agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.200",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "chromadb>=0.5,<2.0",
    "aiosqlite>=0.20,<1.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp>=1.25,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
    "structlog>=24.4,<26.0",
    "anyio>=4.6,<5.0",
    "rich>=13.8,<15.0",
    "pyyaml>=6.0,<7.0",
    "restrictedpython>=8.0,<9.0",
    "html2text>=2024.2.26",
    "jsonschema>=4.23,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2.0",
    "httpx[testing]>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pytest-cov>=5.0,<8.0",
    "types-pyyaml",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["RestrictedPython", "RestrictedPython.*"]
ignore_missing_imports = true

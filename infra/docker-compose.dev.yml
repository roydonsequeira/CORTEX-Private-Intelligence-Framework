services:
  quietpost-api:
    volumes:
      - ../src:/app/src
    environment:
      - QUIETPOST_LOG_LEVEL=DEBUG
    command:
      [
        "uvicorn",
        "quietpost.api.server:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

networks:
  quietpost-net:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - quietpost-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ChromaDB runs embedded inside quietpost-api via chromadb.PersistentClient and is
  # persisted to the quietpost_data volume; no standalone Chroma container is needed.

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    networks:
      - quietpost-net

  quietpost-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - QUIETPOST_OLLAMA_BASE_URL=http://ollama:11434
      - QUIETPOST_CHROMA_PATH=/app/.quietpost/chroma
      - QUIETPOST_DB_PATH=/app/.quietpost/quietpost.db
      - QUIETPOST_OTEL_ENDPOINT=http://jaeger:4317
      - QUIETPOST_TELEMETRY_ENABLED=true
      # The UI server reaches the API as "quietpost-api"; browsers use localhost.
      - QUIETPOST_ALLOWED_HOSTS=["localhost", "127.0.0.1", "quietpost-api"]
    depends_on:
      - ollama
      - jaeger
    networks:
      - quietpost-net
    volumes:
      - quietpost_data:/app/.quietpost
      # The agent reads and writes only here; drop documents into ./workspace.
      - ../workspace:/app/workspace

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time by Next.js.
        NEXT_PUBLIC_QUIETPOST_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - quietpost-api
    networks:
      - quietpost-net

volumes:
  quietpost_data:

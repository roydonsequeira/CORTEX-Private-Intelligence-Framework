# Low-resource demo stack: CPU-only Ollama with a tiny model, for laptops and
# quick live demos where no GPU is available. Self-contained (do NOT layer it on
# docker-compose.yml) so the base file's GPU reservation never applies.
#
#   docker compose -f infra/docker-compose.demo.yml up -d
#   make pull-models-demo        # pulls the tiny models
#
# Answers are weaker than the full 8B stack — this shows the machinery (planning,
# streaming, tool calls, memory, tracing), not frontier-model quality.
networks:
  quietpost-net:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - quietpost-net
    # No GPU reservation: runs on CPU.

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    networks:
      - quietpost-net

  quietpost-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - QUIETPOST_OLLAMA_BASE_URL=http://ollama:11434
      # Point every model capability at one tiny CPU-friendly model.
      - QUIETPOST_OLLAMA_MODEL=llama3.2:1b
      - QUIETPOST_REASONING_MODEL=llama3.2:1b
      - QUIETPOST_CODE_MODEL=llama3.2:1b
      - QUIETPOST_EMBED_MODEL=nomic-embed-text
      - QUIETPOST_CHROMA_PATH=/app/.quietpost/chroma
      - QUIETPOST_DB_PATH=/app/.quietpost/quietpost.db
      - QUIETPOST_OTEL_ENDPOINT=http://jaeger:4317
      - QUIETPOST_TELEMETRY_ENABLED=true
      # The UI server reaches the API as "quietpost-api"; browsers use localhost.
      - QUIETPOST_ALLOWED_HOSTS=["localhost", "127.0.0.1", "quietpost-api"]
    depends_on:
      - ollama
      - jaeger
    networks:
      - quietpost-net
    volumes:
      - quietpost_data:/app/.quietpost
      # The agent reads and writes only here; drop documents into ./workspace.
      - ../workspace:/app/workspace

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time by Next.js.
        NEXT_PUBLIC_QUIETPOST_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - quietpost-api
    networks:
      - quietpost-net

volumes:
  quietpost_data:

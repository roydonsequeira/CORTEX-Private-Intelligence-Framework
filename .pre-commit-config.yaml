# Pre-commit hooks for CORTEX. Install with:
#   pip install pre-commit && pre-commit install
# Run against everything with:
#   pre-commit run --all-files
#
# ruff and mypy run from your dev environment (pip install -e ".[dev]"), so they
# use the same versions as CI, and mypy can see CORTEX's installed dependencies.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy src tests
        language: system
        types: [python]
        pass_filenames: false
